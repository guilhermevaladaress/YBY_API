spring.datasource.url=jdbc:h2:mem:yby_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema recriado a cada execucao de teste a partir das entidades; Flyway desativado em teste.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Sem seed automatico em testes: cada teste prepara seus proprios dados.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

app.jwt.secret=ZGV2LXNlY3JldC15YnktYXBpLXN1cGVyLXNlY3JldC0zMmJ5dGVzLQ==
app.jwt.expires-in-seconds=28800

# Sem recalculo automatico nem chamadas ao INPE durante os testes.
app.inteligencia.scheduler.enabled=false
