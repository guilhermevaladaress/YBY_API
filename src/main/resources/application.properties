spring.application.name=yby-api

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:yby_api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# App Security
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-dev-only-secret-key-change-me}
app.jwt.expires-in-seconds=28800
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allow-all-in-dev=${CORS_ALLOW_ALL_IN_DEV:true}

# Import scheduler
app.import.deter.enabled=${IMPORT_DETER_ENABLED:false}

# Problem Details
spring.mvc.problemdetails.enabled=true
