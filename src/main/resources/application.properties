spring.application.name=yby-api

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/yby_api}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# App Security
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-dev-only-secret-key-change-me}
app.jwt.expires-in-seconds=28800
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allow-all-in-dev=${CORS_ALLOW_ALL_IN_DEV:true}

# Import scheduler
app.import.deter.enabled=${IMPORT_DETER_ENABLED:false}

# Problem Details
spring.mvc.problemdetails.enabled=true
