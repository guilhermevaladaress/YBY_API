spring.application.name=yby-api

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:yby_api;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# Schema versionado pelo Flyway (fonte de verdade). Hibernate apenas valida o mapeamento.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway: migrations em db/migration (V1 schema, V2 seed inicial).
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Seed via Flyway (V2); spring.sql.init desativado para evitar carga duplicada.
spring.sql.init.mode=never

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# App Security
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-dev-only-secret-key-change-me}
app.jwt.expires-in-seconds=28800
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.cors.allow-all-in-dev=${CORS_ALLOW_ALL_IN_DEV:true}

# E-mail transacional (Resend) - recuperacao de senha.
# A chave NUNCA fica aqui: vem da variavel de ambiente RESEND_API_KEY.
# Sem chave, o envio e desativado e o fluxo cai no fallback (token na resposta).
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:YBY <onboarding@resend.dev>}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.mvc.problemdetails.enabled=true

# Inteligencia preditiva: recalculo na subida + agendamento diario (focos INPE + serie historica).
app.inteligencia.scheduler.enabled=${INTELIGENCIA_SCHEDULER_ENABLED:true}
app.inteligencia.scheduler.cron=${INTELIGENCIA_SCHEDULER_CRON:0 0 3 * * *}

